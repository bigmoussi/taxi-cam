name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build run ID from the checked Windows build summary (not build number)'
        required: true
        type: string
      build_attempt:
        description: 'Build attempt from the checked Windows build summary'
        required: true
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-release-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify selected build attempt
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_ATTEMPT: ${{ inputs.build_attempt }}
        run: |
          if ($env:BUILD_RUN_ID -notmatch '^[1-9][0-9]*$' -or $env:BUILD_ATTEMPT -notmatch '^[1-9][0-9]*$') { throw 'Build run ID and attempt must be positive integers.' }
          $json = & gh api "repos/$env:GH_REPO/actions/runs/$env:BUILD_RUN_ID/attempts/$env:BUILD_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the selected build attempt.' }
          $run = $json | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/release.yml' -or $run.head_branch -ne 'main' -or
              $run.repository.full_name -ne $env:GH_REPO -or $run.head_repository.full_name -ne $env:GH_REPO -or
              $run.event -notin @('push', 'workflow_dispatch') -or
              $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or
              $run.run_attempt -ne [long]$env:BUILD_ATTEMPT -or $run.head_sha -notmatch '^[0-9a-f]{40}$') {
            throw 'Select a successful Windows build attempt from main in this repository.'
          }
          "commit=$($run.head_sha)" >> $env:GITHUB_OUTPUT
          "number=$($run.run_number)" >> $env:GITHUB_OUTPUT

      - name: Check out the exact built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download and publish the checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_ATTEMPT: ${{ inputs.build_attempt }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          SOURCE_COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          & gh run download $env:BUILD_RUN_ID --repo $env:GH_REPO --name "windows-release-$env:BUILD_NUMBER-attempt-$env:BUILD_ATTEMPT" --dir build
          if ($LASTEXITCODE -ne 0) { throw 'Release candidate missing or expired. Build and check a new candidate.' }
          $packages = @(Get-ChildItem build/packages -Filter '*.zip' -File)
          $installers = @(Get-ChildItem build/packages -Filter '*-setup.exe' -File)
          if ($packages.Count -ne 1 -or $installers.Count -ne 1) { throw 'Expected exactly one package and installer.' }
          ./ci/publish-release.ps1 -Package $packages[0].FullName -Installer $installers[0].FullName -Repository $env:GH_REPO -Commit $env:SOURCE_COMMIT -BuildNumber $env:BUILD_NUMBER -BuildRunId $env:BUILD_RUN_ID
