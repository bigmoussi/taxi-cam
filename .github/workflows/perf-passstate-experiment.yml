name: Windows performance plus PassState experiment

on:
  pull_request:
    branches: [main]

concurrency:
  group: windows-perf-passstate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf-passstate:
    name: Performance branch plus safe PassState
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out pull-request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply safe scoped PassState port
        run: |
          ./ci/experiments/apply-scoped-passstate.ps1
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Scoped PassState port failed git diff --check.' }
          $manager = Get-Content -Raw -LiteralPath src/graphics/scene_capture_manager.cpp
          if ($manager -notmatch 'invalidate_named_sources') { throw 'Scoped PassState manager policy missing after port.' }
          $state = Get-Content -Raw -LiteralPath src/graphics/scene_source_state.cpp
          if ($state -notmatch 'Recording::invalidate_named_sources') { throw 'Scoped PassState source-state implementation missing after port.' }

      - name: Confirm this workflow cannot publish
        run: ./ci/pr-test-build_test.ps1

      - name: Test semantic version progression
        run: ./ci/version_test.ps1

      - name: Cache verified compiler archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/deps/llvm-mingw.zip
          key: windows-2025-llvm-${{ hashFiles('dependencies.json') }}

      - name: Bootstrap pinned compiler
        run: ./bootstrap.ps1

      - name: Build, validate and smoke-test combined candidate
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Start-Transcript -Path build/perf-passstate-validation.log
          try {
            ./build.ps1 -Validate -WarpOnly
            ./smoke-test.ps1
          } finally {
            Stop-Transcript
          }

      - name: Write combined-candidate checksums
        run: |
          $native = 'build/native'
          $receipt = Get-Content -Raw -LiteralPath (Join-Path $native 'validation.json') | ConvertFrom-Json
          if (-not $receipt.passed) { throw 'Combined candidate validation receipt did not pass.' }
          $lines = foreach ($name in @('taxi-cam.exe', 'taxi-camera-bridge.dll')) {
            $path = Join-Path $native $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Combined candidate missing $name." }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content -LiteralPath (Join-Path $native 'SHA256SUMS.txt') -Encoding ascii

      - name: Keep combined experimental binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-perf-passstate-${{ github.event.pull_request.number }}-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/native/taxi-cam.exe
            build/native/taxi-camera-bridge.dll
            build/native/SHA256SUMS.txt
            build/native/validation.json
            build/native/version.json
            build/perf-passstate-validation.log
            ci/experiments/apply-scoped-passstate.ps1

      - name: Record experiment status
        run: |
          'This artifact combines the dormant performance/freeze-guard branch with the conservative scoped PassState fix. It is an experiment, not a release.' >> $env:GITHUB_STEP_SUMMARY
          'No source change is applied to main by this workflow; the safety fix is injected only into the CI working tree.' >> $env:GITHUB_STEP_SUMMARY
